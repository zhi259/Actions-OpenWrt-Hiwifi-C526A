name: HiWiFi X OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Free Disk Space & Setup System
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-upx libfuse-dev ack antlr3 asciidoc autoconf automake autopoint binutils bison bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev liblzo2-dev libncurses5-dev libpam0g-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Clone LEDE Source (20230609 Tag)
        run: |
          git clone --branch 20230609 https://github.com/coolsnowwolf/lede.git openwrt
          cd openwrt

      - name: Add Third-Party Feeds & Tools (PassWall2, Argon, FakeSIP, FakeHTTP)
        run: |
          cd openwrt
          
          # 1. 导入 PassWall2 及其依赖源
          echo "src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git;main" >> feeds.conf.default
          echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall.git;main" >> feeds.conf.default
          
          # 更新并安装 Feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 2. 将 fakesip 和 fakehttp 源码直接克隆到 package 目录中参与编译
          git clone https://github.com/MikeWang000000/FakeSIP.git package/fakesip
          git clone https://github.com/MikeWang000000/FakeHTTP.git package/fakehttp

      - name: Setup Custom Configuration (.config)
        run: |
          cd openwrt
          
          cat <<EOF > .config
          # --- 目标架构：极路由X C526A (IPQ40xx) ---
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_DEVICE_hiwifi_c526a=y
          
          # --- 界面与 Argon 暗色主题 ---
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          
          # --- 核心网络与 NFQUEUE 依赖（fakesip / fakehttp 必需） ---
          CONFIG_PACKAGE_kmod-ipt-nfqueue=y
          CONFIG_PACKAGE_kmod-ipt-raw=y
          CONFIG_PACKAGE_kmod-ipt-nat=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_iptables-mod-conntrack-extra=y
          CONFIG_PACKAGE_iptables-mod-extra=y
          
          # --- 自定义编译的 fakesip 与 fakehttp ---
          CONFIG_PACKAGE_fakesip=y
          CONFIG_PACKAGE_fakehttp=y
          
          # --- PassWall2 与 sing-box (支持 Hysteria2) ---
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=y
          CONFIG_PACKAGE_sing-box=y
          
          # --- opkg 软件源与插件管理支持 ---
          CONFIG_PACKAGE_opkg=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          EOF

          # 自动补全并校验依赖关系
          make defconfig

      - name: Download Package Source Files
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Organize Artifacts
        run: |
          cd openwrt/bin/targets/ipq40xx/generic/
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

      - name: Upload Firmware to Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: HiWiFi-X-Custom-Firmware-With-FakeSIP
          path: |
            ${{ env.FIRMWARE_PATH }}/*.bin
            ${{ env.FIRMWARE_PATH }}/*.ubi
            ${{ env.FIRMWARE_PATH }}/packages/
